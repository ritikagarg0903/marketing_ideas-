  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;schole-paths&quot;&gt;
&lt;style&gt;
#schole-paths{--paper:light-dark(#f5f3eb,#202821);--ink:light-dark(#172d26,#eef3e9);--surface:light-dark(#fff,#2b352e);--line:light-dark(#d8dfd5,#4a584d);--muted:light-dark(#53675a,#bdccbc);--active:light-dark(#233e30,#d6efb9);--on:light-dark(#fff,#203020);--soft:light-dark(#e7efdf,#384631);background:var(--paper);color:var(--ink);padding:32px;border-radius:16px;font-family:Arial,sans-serif}#schole-paths *{box-sizing:border-box}#schole-paths .mast{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}#schole-paths .brand{font:400 30px Georgia,serif}#schole-paths .eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}#schole-paths h2{font:400 clamp(30px,5vw,46px)/1.1 Georgia,serif;margin:26px 0 12px}#schole-paths .sub{color:var(--muted);font-size:15px;line-height:1.5}#schole-paths .goal{background:var(--active);color:var(--on);padding:20px;text-align:center;border-radius:12px;margin:25px auto 0;max-width:380px}#schole-paths .goal small{font-size:11px;letter-spacing:1.5px}#schole-paths .goal div{font:400 23px Georgia,serif;margin-top:8px}#schole-paths .connector{width:80%;height:24px;border-top:1px solid var(--line);margin:24px auto 0;position:relative}#schole-paths .connector:before{content:&#x27;&#x27;;position:absolute;height:24px;border-left:1px solid var(--line);top:-24px;left:50%}#schole-paths .people{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}#schole-paths button{cursor:pointer;font-family:inherit}#schole-paths .person{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:14px 8px;min-height:85px;text-align:left}#schole-paths .person[aria-pressed=true]{background:var(--active);color:var(--on);border-color:var(--active)}#schole-paths .person span{display:block;font-size:12px;margin-top:7px;line-height:1.4}#schole-paths .person strong{font-size:16px;font-weight:500}#schole-paths .detail{margin-top:18px;background:var(--surface);border-radius:12px;padding:24px;display:grid;grid-template-columns:1fr 1.3fr;gap:24px}#schole-paths h3{font:400 25px Georgia,serif;margin:10px 0 18px}#schole-paths .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:17px}#schole-paths .value{font-size:14px;line-height:1.55;margin-top:5px}#schole-paths .lesson{background:var(--soft);padding:20px;border-radius:8px}#schole-paths .lesson h4{font-size:19px;font-weight:500;line-height:1.3;margin:10px 0}#schole-paths .question{font-size:14px;line-height:1.55}#schole-paths .answer{display:block;text-align:left;width:100%;margin-top:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:11px;font-size:13px;line-height:1.4}#schole-paths .answer[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 3px 0 var(--ink)}#schole-paths .feedback{font-size:13px;line-height:1.5;margin-top:14px}#schole-paths .shared{display:flex;gap:18px;align-items:center;margin-top:22px;border-top:1px solid var(--line);padding-top:18px;font-size:13px;line-height:1.5}#schole-paths .foot{font-size:11px;color:var(--muted);margin-top:22px}@media(max-width:620px){#schole-paths{padding:20px}#schole-paths .people{grid-template-columns:repeat(2,1fr)}#schole-paths .connector{display:none}#schole-paths .people{margin-top:16px}#schole-paths .detail{grid-template-columns:1fr}#schole-paths .shared{display:block}}

&lt;div class=&quot;mast&quot;&gt;&lt;span class=&quot;brand&quot;&gt;Scholé&lt;/span&gt;&lt;span class=&quot;eyebrow&quot;&gt;02 / Personalization concept&lt;/span&gt;&lt;/div&gt;
&lt;h2&gt;One learning goal.&lt;br&gt;Five different starting points.&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;One company adopting AI. Five roles learning to evaluate it in the work they actually do.&lt;/p&gt;
&lt;div class=&quot;goal&quot;&gt;&lt;small&gt;SHARED LEARNING GOAL&lt;/small&gt;&lt;div&gt;Evaluate an AI workflow&lt;br&gt;before you scale it&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;connector&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;people&quot; aria-label=&quot;Choose a learner&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;person&quot; data-person=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;&lt;strong&gt;Maya&lt;/strong&gt;&lt;span&gt;Growth marketer&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;person&quot; data-person=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Leo&lt;/strong&gt;&lt;span&gt;Sales lead&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;person&quot; data-person=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Aisha&lt;/strong&gt;&lt;span&gt;Support manager&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;person&quot; data-person=&quot;3&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Noah&lt;/strong&gt;&lt;span&gt;AI engineer&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;person&quot; data-person=&quot;4&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Priya&lt;/strong&gt;&lt;span&gt;Operations director&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;detail&quot; aria-live=&quot;polite&quot;&gt;&lt;section&gt;&lt;div class=&quot;eyebrow&quot;&gt;Selected learning path&lt;/div&gt;&lt;h3 id=&quot;sp-name&quot;&gt;Maya’s next step&lt;/h3&gt;&lt;div class=&quot;label&quot;&gt;Already demonstrates&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;sp-knows&quot;&gt;Builds reusable prompts from campaign briefs and runs controlled landing-page experiments.&lt;/div&gt;&lt;div class=&quot;label&quot;&gt;Next capability to build&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;sp-gap&quot;&gt;Design an evaluation that separates persuasive copy from supported product claims before A/B testing.&lt;/div&gt;&lt;div class=&quot;label&quot;&gt;Personalized sequence&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;sp-route&quot;&gt;Skip prompting basics → audit claims against source material → build a review rubric → test a new brief&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;lesson&quot;&gt;&lt;div class=&quot;eyebrow&quot; id=&quot;sp-type&quot;&gt;Campaign review · sample exercise&lt;/div&gt;&lt;h4 id=&quot;sp-title&quot;&gt;The copy is persuasive. The claim is wrong.&lt;/h4&gt;&lt;div class=&quot;question&quot; id=&quot;sp-question&quot;&gt;An AI draft says “cuts onboarding time by 40%.” The source case study reports 40% fewer support tickets, with no onboarding-time measurement. Which evaluation catches this error without rejecting useful paraphrases?&lt;/div&gt;&lt;div id=&quot;sp-answers&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;answer&quot; data-answer=&quot;0&quot; aria-pressed=&quot;false&quot;&gt;Require every claim to use the source’s exact wording.&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;answer&quot; data-answer=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;Check each claim’s metric, population and conditions against its source; score style separately.&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;answer&quot; data-answer=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;Have a second model score factual accuracy without the source.&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;sp-feedback&quot;&gt;Choose an approach to see feedback and the next exercise.&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div class=&quot;shared&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Comparable evidence&lt;/div&gt;&lt;div&gt;One proposed rubric across roles: define success · test representative cases · diagnose failures · justify rollout boundaries.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;foot&quot;&gt;Independent application concept informed by Scholé’s public product descriptions. Fictional learner profiles; authored exercises and rubric, not official curriculum. Feedback is prewritten for this demo.&lt;/div&gt;
&lt;script&gt;
(()=&gt;{const root=document.getElementById(&#x27;schole-paths&#x27;);const data=[
{name:&#x27;Maya&#x27;,knows:&#x27;Builds reusable prompts from campaign briefs and runs controlled landing-page experiments.&#x27;,gap:&#x27;Design an evaluation that separates persuasive copy from supported product claims before A/B testing.&#x27;,route:&#x27;Skip prompting basics → audit claims against source material → build a review rubric → test a new brief&#x27;,type:&#x27;Campaign review&#x27;,title:&#x27;The copy is persuasive. The claim is wrong.&#x27;,question:&#x27;An AI draft says “cuts onboarding time by 40%.” The source case study reports 40% fewer support tickets, with no onboarding-time measurement. Which evaluation catches this error without rejecting useful paraphrases?&#x27;,answers:[&#x27;Require every claim to use the source’s exact wording.&#x27;,&#x27;Check each claim’s metric, population and conditions against its source; score style separately.&#x27;,&#x27;Have a second model score factual accuracy without the source.&#x27;],feedback:[&#x27;Exact matching catches wording changes, but would also reject accurate paraphrases. The failure here is a changed outcome metric. Next: compare two rewrites that use different words but preserve the same evidence.&#x27;,&#x27;Best fit. The draft changes the measured outcome, so a claim-to-source check should fail it regardless of style. Next: build a rubric that also catches overstated causality and missing qualifiers.&#x27;,&#x27;A second opinion without evidence cannot reliably verify the claim. Next: annotate the source passage that supports—or fails to support—each statement.&#x27;]},
{name:&#x27;Leo&#x27;,knows:&#x27;Uses call transcripts to assess deal qualification and has built structured AI summaries for CRM handoffs.&#x27;,gap:&#x27;Evaluate whether extracted deal facts preserve uncertainty, conflicting evidence and source attribution.&#x27;,route:&#x27;Skip summarization basics → reconcile conflicting statements → design evidence fields → audit unseen calls&#x27;,type:&#x27;Evidence reconciliation&#x27;,title:&#x27;The summary turns a condition into a commitment.&#x27;,question:&#x27;Early in a call, the buyer says “We can sign this quarter.” Later: “Only if security approves; their review has not started.” The AI records “Close: this quarter.” Which output best preserves the evidence for a forecast review?&#x27;,answers:[&#x27;Record this quarter as the close date and reduce the confidence score.&#x27;,&#x27;Replace the close date with next quarter to account for the review delay.&#x27;,&#x27;Record this quarter as conditional, name the unresolved security review, and cite both statements.&#x27;],feedback:[&#x27;A confidence score does not explain what must happen for the date to hold. Next: rewrite the output so a reviewer can identify the dependency without rereading the call.&#x27;,&#x27;That substitutes a new assumption for the buyer’s conditional date. Next: distinguish an explicitly stated fact from a forecast inference.&#x27;,&#x27;Best fit. It preserves the proposed date and the condition, without inventing a revised timeline. Next: design a CRM extraction schema that separates stated facts, conditions and analyst inferences.&#x27;]},
{name:&#x27;Aisha&#x27;,knows:&#x27;Designs support routing rules, audits response quality and has tested an AI assistant against approved help articles.&#x27;,gap:&#x27;Set release criteria by issue type so strong routine performance cannot hide failures in policy exceptions.&#x27;,route:&#x27;Skip FAQ automation → segment evaluation cases → test exception handling → define escalation gates&#x27;,type:&#x27;Release decision&#x27;,title:&#x27;A 94% pass rate hides the hardest tickets.&#x27;,question:&#x27;A test contains 90 routine tickets and 10 policy exceptions. The assistant passes all routine cases but only 4 exceptions. Incorrect exception answers could authorize refunds outside policy. What is the strongest next release plan?&#x27;,answers:[&#x27;Pilot routine cases with monitoring; require exception escalation and test that routing before release.&#x27;,&#x27;Release across both categories with a human audit of 10% of replies.&#x27;,&#x27;Add more routine examples to the test before deciding whether to release.&#x27;],feedback:[&#x27;Best fit. The aggregate score hides a 40% exception pass rate. A narrower pilot is justified only if exception detection and escalation also work. Next: add ambiguous tickets that test the routing boundary.&#x27;,&#x27;Sampling may find errors after customers receive incorrect commitments. Next: compare a post-response audit with a pre-response escalation gate for exception cases.&#x27;,&#x27;More easy cases could raise the aggregate score without fixing the failure. Next: construct separate evaluation sets for routine, exception and ambiguous requests.&#x27;]},

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }

  };

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
